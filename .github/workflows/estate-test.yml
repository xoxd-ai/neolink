# Estate test job (TIN-8227). It runs the workspace tests with the GStreamer
# plugins the RTSP and audio code needs, on the Debian-family runner that is
# closest to the field VM. This job, not the older build matrix, is the gate a
# change must pass before it merges or before a receiver pins its rev.
name: Estate test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A push to master never
# cancels, so every master commit keeps its own estate-test result and can be
# chosen as a receiver pin.
concurrency:
  group: estate-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Proposal: the toolchain the cross jobs of build.yml already build with.
  rust_version: "1.82.0"
  CARGO_TERM_COLOR: never

jobs:
  estate-test:
    name: estate-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: apt install GStreamer and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstrtspserver-1.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            protobuf-compiler \
            python3-yaml

      - name: Estate CI self-test
        run: python3 -m unittest discover -s .github/estate-test -p 'test_*.py' -v

      - name: GStreamer elements
        run: bash .github/estate-test/check_gst_elements.sh voaacenc avenc_aac faad aacparse rtpmp4gpay

      - name: Install Rust ${{ env.rust_version }}
        run: |
          rustup toolchain install "${rust_version}" --profile minimal
          rustup default "${rust_version}"
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: estate-test-${{ runner.os }}-${{ env.rust_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            estate-test-${{ runner.os }}-${{ env.rust_version }}-

      # FakeCamera sits behind neolink_core's test-util feature, which no
      # shipped binary may carry.
      - name: release_build_has_no_test_util
        run: bash .github/estate-test/check_no_test_util.sh

      - name: cargo test
        shell: bash
        run: |
          cargo test --workspace --locked 2>&1 | tee cargo-test.log

      - name: estate_test_job_runs_core_tests
        if: ${{ !cancelled() }}
        run: python3 .github/estate-test/cargo_test_summary.py cargo-test.log --require neolink_core --min 1

      # The RTSP frame pusher resubscribes to a dropped camera from a plain
      # thread. These tests drive that path from such a thread. Each is named,
      # so a change that renames, gates or ignores one fails the job.
      - name: rtsp_resubscribe_tests_ran
        if: ${{ !cancelled() }}
        run: >-
          python3 .github/estate-test/cargo_test_summary.py cargo-test.log
          --require-test rtsp::factory::resubscribe_tests::resubscribe_on_a_plain_thread_returns_the_new_stream
          --require-test rtsp::factory::resubscribe_tests::resubscribe_on_a_plain_thread_times_out_a_hung_attempt
          --require-test rtsp::factory::resubscribe_tests::resubscribe_stops_once_the_client_has_gone
          --require-test rtsp::factory::resubscribe_tests::resubscribe_to_a_gone_camera_retries_until_the_client_leaves
          --require-test rtsp::factory::resubscribe_tests::resubscribe_backoff_stops_at_its_max

      # Local discovery gives each open destination its own tid. A frame pusher
      # that ends on an error or a panic leaves a warn line naming its camera
      # and stream. Each test is named, so a change that renames, gates or
      # ignores one fails the job.
      - name: discovery_tid_tests_ran
        if: ${{ !cancelled() }}
        run: >-
          python3 .github/estate-test/cargo_test_summary.py cargo-test.log
          --require-test bc_protocol::connection::discovery::tests::every_open_destination_gets_its_own_tid
          --require-test bc_protocol::connection::discovery::tests::new_tid_is_refused_while_all_are_held

      - name: pusher_end_tests_ran
        if: ${{ !cancelled() }}
        run: >-
          python3 .github/estate-test/cargo_test_summary.py cargo-test.log
          --require-test rtsp::factory::pusher_end_tests::pusher_error_logs_camera_stream_and_cause_at_warn
          --require-test rtsp::factory::pusher_end_tests::pusher_panic_logs_camera_stream_and_cause_at_warn
          --require-test rtsp::factory::pusher_end_tests::pusher_literal_panic_logs_its_message_at_warn
          --require-test rtsp::factory::pusher_end_tests::pusher_starts_for_a_camera_name_with_a_nul
          --require-test rtsp::factory::pusher_end_tests::pusher_clean_stop_logs_no_warn

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: actionlint estate-test.yml
        run: ./actionlint -color .github/workflows/estate-test.yml
      - name: actionlint build.yml
        # The shell bodies of build.yml predate the estate and carry shellcheck
        # findings outside TIN-8227, so this run checks workflow syntax,
        # expressions, runner labels and action inputs only.
        run: ./actionlint -color -shellcheck= .github/workflows/build.yml
